name: WMA301 | Follow ImmortalWrt, build and release

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if identical release already exists
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/firmware.yml'
      - 'device/**'
      - 'scripts/**'
      - 'configs/**'

permissions:
  contents: write

concurrency:
  group: wma301-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      upstream_sha: ${{ steps.detect.outputs.upstream_sha }}
      tag: ${{ steps.detect.outputs.tag }}
      needed: ${{ steps.detect.outputs.needed }}
    steps:
      - id: detect
        name: Check live ImmortalWrt upstream and successful releases
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/immortalwrt/immortalwrt.git refs/heads/openwrt-25.12 | cut -f1)"
          test -n "$sha"
          u="$(printf '%s' "$sha" | cut -c1-12)"
          l="$(printf '%s' "$GITHUB_SHA" | cut -c1-10)"
          tag="iw25-$u-$l"
          if [ "$FORCE" = "true" ]; then
            tag="$tag-rebuild$GITHUB_RUN_ID"
          fi
          echo "upstream_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Already published $tag; no build needed"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Build required for $tag"
          fi

  build:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      UPSTREAM_SHA: ${{ needs.check.outputs.upstream_sha }}
      RELEASE_TAG: ${{ needs.check.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Save local revision
        run: echo "PROJECT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet /opt/ghc || true
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev libelf-dev python3 \
            python3-pyelftools python3-setuptools rsync swig unzip zlib1g-dev file \
            wget curl xz-utils zstd
      - name: Check integration scripts
        run: |
          python3 -m py_compile scripts/prepare.py scripts/verify.py scripts/fit_inspect.py
          python3 scripts/test_layout.py
      - name: Clone current upstream (no permanent SHA lock)
        run: |
          set -euo pipefail
          git clone --depth=1 --branch openwrt-25.12 \
            https://github.com/immortalwrt/immortalwrt.git upstream
          actual="$(git -C upstream rev-parse HEAD)"
          test "$actual" = "$UPSTREAM_SHA" || {
            echo "::error::Upstream changed during check. Retry next run."
            exit 1
          }
      - name: Add WMA301 OEM device and packages
        run: |
          set -euo pipefail
          python3 scripts/prepare.py --upstream upstream
          cp configs/wma301.config upstream/.config
      - uses: actions/cache@v4
        with:
          path: upstream/dl
          key: iw25-wma301-dl-${{ runner.os }}-${{ hashFiles('configs/wma301.config') }}
          restore-keys: |
            iw25-wma301-dl-${{ runner.os }}-
      - name: Resolve feeds and device config
        working-directory: upstream
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          grep -q '^CONFIG_TARGET_mediatek_filogic=y$' .config
          grep -E '^CONFIG_TARGET_.*wma301-v2=y$' .config
      - name: Download source archives
        working-directory: upstream
        run: |
          make download -j4 > ../download.log 2>&1 || {
            tail -n 150 ../download.log
            exit 1
          }
      - name: Full firmware build
        working-directory: upstream
        run: |
          make -j2 > ../build.log 2>&1 || {
            tail -n 220 ../build.log
            exit 1
          }
          tail -n 35 ../build.log
      - name: Check actual FITs, kernel, SquashFS and protected NAND geometry
        run: |
          set -euo pipefail
          python3 scripts/verify.py --images upstream/bin/targets/mediatek/filogic \
            --output dist --upstream-sha "$UPSTREAM_SHA" --local-sha "$PROJECT_SHA"
          (cd dist && sha256sum -c SHA256SUMS)
          test "$(find dist -maxdepth 1 -name '*.itb' | wc -l)" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: VERIFIED_WMA301_FITS_${{ needs.check.outputs.tag }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - name: Publish only after all tests passed
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "Existing successful release cannot be overwritten"
            exit 0
          fi
          cat > release-notes.md <<EOF
          WMA301 v2.0 **experimental pre-release; offline verified, hardware untested**.

          Upstream: https://github.com/immortalwrt/immortalwrt/commit/$UPSTREAM_SHA
          Device integration: https://github.com/$GITHUB_REPOSITORY/commit/$PROJECT_SHA

          Includes initramfs recovery FIT and SquashFS sysupgrade FIT.
          Verified: FIT hashes and actual payloads, OEM NAND 7 MiB + single UBI 121 MiB, rootdisk reference and calibration region protection.
          This does NOT initialize the UBI volumes. Do NOT flash to OEM A/B system.
          Failed builds never modify previous successful releases.
          EOF
          if ! gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
              --target "$PROJECT_SHA" --title "WMA301 ImmortalWrt $UPSTREAM_SHA" \
              --notes-file release-notes.md --draft
          fi
          gh release upload "$RELEASE_TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease
          echo "Published: $RELEASE_TAG"
